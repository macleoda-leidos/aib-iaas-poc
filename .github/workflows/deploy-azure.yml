name: Deploy to Azure (Free Tier)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'poc'
        type: choice
        options: [poc, demo]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/consolidated-api
  AZURE_RG: aib-iaas-poc-rg
  AZURE_LOCATION: uksouth

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/azure/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'poc' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group (if not exists)
        run: |
          az group create \
            --name ${{ env.AZURE_RG }} \
            --location ${{ env.AZURE_LOCATION }} \
            --tags project=aib-iaas environment=poc 2>/dev/null || true

      - name: Deploy Bicep Infrastructure
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RG }}
          template: infra/azure/main.bicep
          parameters: >
            environment=poc
            location=${{ env.AZURE_LOCATION }}
            apiImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            repoUrl=${{ github.server_url }}/${{ github.repository }}

      - name: Output Deployment URLs
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | $(az containerapp show -n aib-iaas-poc-env-api -g ${{ env.AZURE_RG }} --query 'properties.configuration.ingress.fqdn' -o tsv) |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | $(az staticwebapp show -n aib-iaas-poc-web -g ${{ env.AZURE_RG }} --query 'defaultHostname' -o tsv) |" >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and Build Web App
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-infrastructure.outputs.apiUrl || '' }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /apps/web
          output_location: .next
