name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [fat, uat, preprod, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/aib-iaas-github-deploy
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        run: |
          for SERVICE in api-gateway recommendation-service document-service integration-orchestrator payment-service audit-service mock-integrations; do
            docker build -f infra/docker/Dockerfile.service --build-arg SERVICE_NAME=$SERVICE -t aib-iaas/$SERVICE:${{ github.sha }} .
            docker tag aib-iaas/$SERVICE:${{ github.sha }} ${{ vars.ECR_REGISTRY }}/aib-iaas/$SERVICE:${{ github.sha }}
            docker push ${{ vars.ECR_REGISTRY }}/aib-iaas/$SERVICE:${{ github.sha }}
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Apply
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        run: |
          terraform init
          terraform plan -var="container_image_tag=${{ github.sha }}" -out=tfplan
          terraform apply tfplan
