name: CI Pipeline — Build, Test & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== UNIT & INTEGRATION TESTS =====
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --workspace=packages/validation
          npm ci --workspace=services/recommendation-service
          npm ci --workspace=services/credit-check-service
          npm ci --workspace=services/mock-integrations
          npm ci --workspace=services/user-service
          npm ci --workspace=services/api-gateway

      - name: Run unit & integration tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Check coverage thresholds
        run: |
          echo "Coverage report generated. Thresholds enforced by vitest config."
          # In CI, vitest will exit non-zero if thresholds are not met

  # ===== E2E TESTS =====
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend services
        run: |
          cd services/mock-integrations && npx tsx src/index.ts &
          cd services/recommendation-service && npx tsx src/index.ts &
          cd services/api-gateway && npx tsx src/index.ts &
          cd services/user-service && npx tsx src/index.ts &
          sleep 8

      - name: Start frontend
        run: |
          cd apps/web && npm run build && npm run start &
          cd apps/admin && npm run build && npm run start &
          sleep 10

      - name: Run Playwright E2E tests
        run: npx playwright test --config=tests/e2e/playwright.config.ts
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/

  # ===== BUILD VERIFICATION =====
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Docker image
        run: docker build -f infra/azure/Dockerfile.api -t aib-iaas-api:test .

      - name: Verify container starts
        run: |
          docker run -d -p 3001:3001 --name test-api aib-iaas-api:test
          sleep 10
          curl -f http://localhost:3001/api/health || exit 1
          docker stop test-api

  # ===== QUALITY GATE (deployment readiness) =====
  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, e2e, build]
    steps:
      - name: Quality Gate Passed
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  ✓ QUALITY GATE PASSED                  ║"
          echo "║                                          ║"
          echo "║  Unit tests:        ✓ Passed            ║"
          echo "║  Integration tests: ✓ Passed            ║"
          echo "║  E2E tests:         ✓ Passed            ║"
          echo "║  Coverage:          ✓ Above threshold   ║"
          echo "║  Docker build:      ✓ Verified          ║"
          echo "║                                          ║"
          echo "║  Ready for deployment to FAT/UAT        ║"
          echo "╚══════════════════════════════════════════╝"
