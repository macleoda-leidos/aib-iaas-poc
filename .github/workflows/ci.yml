name: CI Pipeline — Build, Test & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== UNIT & INTEGRATION TESTS =====
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ===== .NET TESTS =====
  #
  # The first non-vitest suite in this pipeline. services/dotnet-api has shipped since
  # Sprint 20 with no test project and no CI step, so its recommendation engine had never
  # been executed by anything but a person clicking through the demo — which is how it
  # kept a £1,500 MAP floor that SSI 2023/9 reg.2 removed in February 2023, and how it
  # evaluated PTD before MAP, while the Node engine did neither. Two deployed backends,
  # different statutory advice for the same applicant, no failing test (GAP-024).
  #
  # Runs in parallel with `test` rather than after it: the two suites share only
  # tests/fixtures/recommendation-cases.json, and both must go red when it changes.
  dotnet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restored explicitly so a NuGet failure reports as a restore failure rather than
      # as an inscrutable build error.
      - name: Restore
        run: dotnet restore tests/dotnet/IAAS.Api.Tests/IAAS.Api.Tests.csproj

      - name: Build
        run: dotnet build tests/dotnet/IAAS.Api.Tests/IAAS.Api.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/dotnet/IAAS.Api.Tests/IAAS.Api.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  # ===== BUILD VERIFICATION =====
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles every workspace with tsc. Without this the Docker build alone
      # can stay green while TypeScript errors accumulate, because the Next apps
      # set ignoreBuildErrors and the container runs sources via tsx.
      - name: Build all workspaces (typecheck)
        run: npm run build

      - name: Build Docker image
        run: docker build -f infra/azure/Dockerfile.api -t aib-iaas-api:test .

      - name: Verify container starts
        run: |
          docker run -d -p 3001:3001 --name test-api aib-iaas-api:test
          sleep 20
          docker logs test-api || true
          curl -f http://localhost:3001/api/health || (docker logs test-api && exit 1)
          # Readiness as well as liveness. /api/health cannot fail by design — it is the
          # platform's probe and a Neon cold start must not fail a deploy — so checking it
          # alone proves only that the process is listening. This is the check that would
          # have caught a container whose database was unreachable (GAP-020), and it also
          # verifies the uploads directory is genuinely writable inside the image.
          curl -f http://localhost:3001/api/health/ready || (docker logs test-api && exit 1)
          docker stop test-api

  # ===== QUALITY GATE =====
  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, dotnet-test, build]
    steps:
      - name: Quality Gate Passed
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  ✓ QUALITY GATE PASSED                  ║"
          echo "║                                          ║"
          echo "║  Unit tests:        ✓ Passed            ║"
          echo "║  Integration tests: ✓ Passed            ║"
          echo "║  .NET parity tests: ✓ Passed            ║"
          echo "║  Coverage:          ✓ Above threshold   ║"
          echo "║  Docker build:      ✓ Verified          ║"
          echo "║  Readiness probe:   ✓ Verified          ║"
          echo "║                                          ║"
          echo "║  Ready for deployment to FAT/UAT        ║"
          echo "╚══════════════════════════════════════════╝"
