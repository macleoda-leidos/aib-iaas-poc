name: CI Pipeline — Build, Test & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== UNIT & INTEGRATION TESTS =====
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ===== BUILD VERIFICATION =====
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Docker image
        run: docker build -f infra/azure/Dockerfile.api -t aib-iaas-api:test .

      - name: Verify container starts
        run: |
          docker run -d -p 3001:3001 --name test-api aib-iaas-api:test
          sleep 20
          docker logs test-api || true
          curl -f http://localhost:3001/api/health || (docker logs test-api && exit 1)
          docker stop test-api

  # ===== QUALITY GATE =====
  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Quality Gate Passed
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  ✓ QUALITY GATE PASSED                  ║"
          echo "║                                          ║"
          echo "║  Unit tests:        ✓ Passed            ║"
          echo "║  Integration tests: ✓ Passed            ║"
          echo "║  Coverage:          ✓ Above threshold   ║"
          echo "║  Docker build:      ✓ Verified          ║"
          echo "║                                          ║"
          echo "║  Ready for deployment to FAT/UAT        ║"
          echo "╚══════════════════════════════════════════╝"
