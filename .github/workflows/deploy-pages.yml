name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        working-directory: apps/web
        run: NEXT_OUTPUT=export npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/aib-iaas-poc"
          NEXT_PUBLIC_API_URL: "https://iaas-api.onrender.com"

      - name: Add .nojekyll
        run: touch apps/web/out/.nojekyll

      # Custom Domain: To enable a custom domain, create apps/web/public/CNAME
      # containing the domain (e.g., iaas.aib.gov.uk). The file will be copied
      # to the output directory automatically during build. Also configure the
      # domain in GitHub repo Settings > Pages > Custom domain.

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/out
          publish_branch: gh-pages
          force_orphan: true
