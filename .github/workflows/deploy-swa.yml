name: Deploy to Azure Static Web Apps

on:
  workflow_run:
    workflows: ["CI Pipeline — Build, Test & Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and Deploy (after quality gate)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: cd apps/web && NEXT_OUTPUT=export npm run build

      - name: Prepare deploy directory
        run: |
          # Copy the static output to a clean deploy directory at repo root
          cp -r apps/web/out deploy
          # Ensure SWA config is present
          cp apps/web/public/staticwebapp.config.json deploy/
          # Log what we're deploying
          echo "=== Deploy directory contents ==="
          ls deploy/
          echo "=== index.html exists ==="
          head -1 deploy/index.html
          echo "=== staticwebapp.config.json ==="
          cat deploy/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "deploy"
          output_location: ""
