name: Deploy to Azure Static Web Apps

# Only deploy AFTER CI pipeline passes (quality gate)
on:
  workflow_run:
    workflows: ["CI Pipeline — Build, Test & Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI succeeded (not on failure)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and Deploy (after quality gate)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (monorepo root)
        run: npm ci
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Static Export
        working-directory: apps/web
        run: NEXT_OUTPUT=export npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Ensure SWA config in output
        run: |
          cp apps/web/public/staticwebapp.config.json apps/web/out/staticwebapp.config.json
          echo "=== SWA config ==="
          cat apps/web/out/staticwebapp.config.json
          echo ""
          echo "=== Output directory ==="
          ls apps/web/out/
          echo "=== index.html size ==="
          wc -c apps/web/out/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "apps/web/out"
          output_location: ""
