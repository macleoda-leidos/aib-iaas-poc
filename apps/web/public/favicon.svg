     file, knocked out in white on the AiB red so it holds its shape down to 16px.
     Both spirals of the device (Path_197 subpaths 0-2, Path_198 subpaths 35-36).
     Geometry was extracted by walking the source path data and taking the bbox of
     the device subpaths, then scaling it to 48 of the 64 tile units. Regenerate the
     same way rather than hand-editing coordinates if the brand artwork changes. -->
