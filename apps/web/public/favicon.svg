<?xml version="1.0" encoding="UTF-8"?>
<!-- AiB favicon. Purpose-built for small sizes: the full logo in aib-logo.svg is a
     120x55.75 wordmark lockup, which letterboxes to roughly 16x7px of ink in a
     browser tab and reads as a smudge. This keeps only the device — the upper
     spiral, Path_198 subpaths 35-36 of that file — knocked out in white on the
     AiB red, filling 48 of the 64 tile units.

     The whole device (both spirals) was tried first and rejected on measurement,
     not taste: the two spirals are portrait overall, so they scale to 0.86x here
     against this one's 1.54x, and rasterising them at 16px produced no fully
     opaque pixels at all — every pixel was a partial grey, i.e. the same smudge
     the wordmark gave. The single spiral is near-square, so it holds solid ink
     and a readable silhouette at tab size.

     Geometry was extracted by walking the source path data and taking the bbox of
     the device subpaths. Regenerate the same way rather than hand-editing
     coordinates if the brand artwork changes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AiB">
  <rect width="64" height="64" rx="12" fill="#d32205"/>
  <g transform="translate(4.335,8.000) scale(1.53649)" fill="#fff">
    <path d="M24.39,6.16c-2.51-2.54-6.2-3.51-9.63-2.51-3.49.94-6.21,3.67-7.14,7.16-.5,1.71-.52,3.51-.08,5.23.42,1.68,1.3,3.2,2.52,4.42,1.24,1.24,2.79,2.14,4.49,2.6,1.67.49,3.45.5,5.13.02,1.72-.5,3.28-1.43,4.53-2.72,1.97-1.86,3.09-4.45,3.11-7.16.06-2.65-1-5.21-2.92-7.04m7.59,10.63l-14.45,14.45-2.25-2.25,3.05-3.05c-1.97.22-3.96.02-5.84-.6-1.81-.62-3.44-1.66-4.78-3.03-2.46-2.4-3.81-5.72-3.7-9.16,0-3.51,1.44-6.87,3.97-9.3C10.4,1.37,13.74-.03,17.22,0c3.45-.08,6.78,1.28,9.19,3.75,1.39,1.36,2.43,3.03,3.03,4.88.57,1.91.68,3.93.32,5.89l2.23,2.27Z"/>
  </g>
</svg>
