version: '3.8'

services:
  mock-integrations:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: mock-integrations
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MOCK_LATENCY_MIN_MS=50
      - MOCK_LATENCY_MAX_MS=200
      - MOCK_FAILURE_RATE=0.02
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/api/mock/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://iaas:iaas_dev@postgres:5432/iaas
      - DATABASE_PATH=/app/data/iaas.db
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:3002
      - DOCUMENT_SERVICE_URL=http://document-service:3003
      - INTEGRATION_SERVICE_URL=http://integration-orchestrator:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - AUDIT_SERVICE_URL=http://audit-service:3007
      - INTEGRATION_MODE=mock
    volumes:
      - app-data:/app/data
      - uploads:/app/uploads
    depends_on:
      mock-integrations:
        condition: service_healthy
      postgres:
        condition: service_healthy

  recommendation-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: recommendation-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002

  document-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: document-service
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - UPLOAD_PATH=/app/uploads
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - SCANNER_MODE=auto
    volumes:
      - uploads:/app/uploads

  integration-orchestrator:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: integration-orchestrator
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MOCK_INTEGRATIONS_URL=http://mock-integrations:3005

  credit-check-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: credit-check-service
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - CREDIT_CHECK_MODE=sandbox
    volumes:
      - app-data:/app/data

  organisation-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: organisation-service
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
    volumes:
      - app-data:/app/data

  user-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: user-service
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
    volumes:
      - app-data:/app/data

  payment-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: payment-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - PAYMENT_MODE=sandbox

  audit-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: audit-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - DATABASE_PATH=/app/data/audit.db
    volumes:
      - app-data:/app/data

  # PostgreSQL database - shared persistence layer
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=iaas
      - POSTGRES_USER=iaas
      - POSTGRES_PASSWORD=iaas_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ClamAV virus scanner - free open-source antivirus
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s  # ClamAV takes time to load virus definitions
    restart: unless-stopped

  # Auto-seed demo data after API gateway starts
  seed:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    command: npx tsx /app/scripts/seed-demo-data.ts
    environment:
      - API_URL=http://api-gateway:3001
    depends_on:
      api-gateway:
        condition: service_started
    restart: "no"

volumes:
  app-data:
  uploads:
  clamav-data:
  pgdata:
