[build]
builder = "dockerfile"
dockerfilePath = "infra/docker/Dockerfile.service"

[deploy]
startCommand = "node services/api-gateway/src/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 10
restartPolicyType = "on_failure"

[service]
name = "iaas-api"
region = "eu-west"

[[services.envs]]
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
INTEGRATION_MODE = "mock"
PORT = "3001"
